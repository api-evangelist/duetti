aid: duetti
name: Duetti
description: 'Duetti is a New York-headquartered music finance and catalog services
  company founded in 2022 by Lior Tibon and Christopher Nolte that buys music rights
  directly from independent artists, songwriters and creators. Artists earning at least
  $2,000 a year from tracks at least six months old can sell masters, publishing shares
  or a percentage of their royalties for an upfront cash payment — no debt, interest
  or recoupment — while keeping whatever they do not sell. Alongside the catalog purchases
  Duetti provides distribution, royalty tracking and claiming, playlisting across a
  network of owned Spotify playlists, sync placement, paid advertising, influencer
  and UGC campaigns, and a commissioned remix program. The company has raised more
  than $435 million, works with 1,100+ music creators, and publishes the Music Economics
  Report and the Billboard Music Finance Index. Duetti operates artist-facing web applications
  (DUO onboarding, statements vault, sync portal) but publishes no public developer
  API, SDK, or machine-readable API contract as of this profile.'
